<!DOCTYPE html>
<html>
<head>
    <title>Abdullah Website</title>

    <style>
        body {
            background: linear-gradient(to right, blue, purple);
            font-family: Arial;
            text-align: center;
            padding-top: 100px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 280px;
            margin: auto;
        }

        h1 {
            color: blue;
        }

        input {
            padding: 12px;
            margin: 10px;
            width: 90%;
            border-radius: 8px;
            border: 1px solid gray;
        }

        button {
            background: blue;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Welcome Abdullah</h1>

        <p>Welcome to my website!</p>

        <input type="text" placeholder="Enter Your Name">

        <br>

        <input type="password" placeholder="Enter Password">

        <br><br>

        <button onclick="alert('Welcome Abdullah!')">
            Login
        </button>

    </div>

</body>
</html>
